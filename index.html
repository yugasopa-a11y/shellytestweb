<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WHAT WOULD SHELLY DO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F4EFE6;
      --ink: #1A1A1A;
      --correct: #3A7D63;
      --wrong: #C1443D;
      --glow: #E8B84B;
      --radius: 16px;
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-sincere: cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    html, body {
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body { position: relative; }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(20px, 5vw, 48px);
      text-align: center;
      opacity: 0;
      transition: opacity 0.4s var(--ease-bounce);
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .screen.active {
      display: flex;
      opacity: 1;
      animation: screenIn 0.5s var(--ease-bounce) forwards;
    }

    @keyframes screenIn {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes screenShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .shake { animation: screenShake 0.5s ease-in-out; }

    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    @keyframes goldPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(232,184,75,0.3); }
      50% { box-shadow: 0 0 40px rgba(232,184,75,0.6); }
    }

    @keyframes timerPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    @keyframes pop {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    h1, h2, h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      line-height: 1.15;
    }

    .title-big {
      font-size: clamp(2.4rem, 8vw, 5rem);
      letter-spacing: -0.03em;
    }
    .title-med {
      font-size: clamp(1.6rem, 5vw, 2.8rem);
      letter-spacing: -0.02em;
    }
    .title-sm {
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      letter-spacing: -0.01em;
    }

    .subtitle {
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      opacity: 0.7;
      margin-top: 12px;
      line-height: 1.5;
      max-width: 420px;
    }

    .body-text {
      font-size: clamp(0.9rem, 2.2vw, 1.05rem);
      line-height: 1.6;
      max-width: 440px;
    }

    .btn-primary {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(1rem, 2.8vw, 1.2rem);
      padding: 16px 40px;
      border: none;
      border-radius: var(--radius);
      background: var(--ink);
      color: var(--bg);
      cursor: pointer;
      transition: transform 0.2s var(--ease-bounce), box-shadow 0.2s ease;
      min-height: 56px;
      min-width: 200px;
      touch-action: manipulation;
    }
    .btn-primary:hover { transform: scale(1.04); box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
    .btn-primary:active { transform: scale(0.97); }

    .choice-btn {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: clamp(0.95rem, 2.4vw, 1.1rem);
      padding: 18px 28px;
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition: transform 0.2s var(--ease-bounce), background 0.2s ease, border-color 0.2s ease;
      width: 100%;
      max-width: 480px;
      text-align: left;
      line-height: 1.45;
      touch-action: manipulation;
      min-height: 60px;
      position: relative;
      overflow: hidden;
    }
    .choice-btn:hover { background: rgba(26,26,26,0.05); transform: translateY(-2px); }
    .choice-btn:active { transform: scale(0.98); }
    .choice-btn + .choice-btn { margin-top: 12px; }

    .choice-btn.correct {
      border-color: var(--correct);
      background: rgba(58,125,99,0.08);
      animation: pulse 0.6s var(--ease-bounce);
    }
    .choice-btn.wrong {
      border-color: var(--wrong);
      background: rgba(193,68,61,0.08);
      animation: pulse 0.6s var(--ease-bounce);
    }
    .choice-btn.disabled {
      pointer-events: none;
      opacity: 0.5;
    }
    .choice-btn .label {
      display: block;
      font-size: 0.75em;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 6px;
    }
    .choice-btn .label.correct-label { color: var(--correct); }
    .choice-btn .label.wrong-label { color: var(--wrong); }

    .choices-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 480px;
      margin-top: 28px;
    }

    .round-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(0.75rem, 2vw, 0.85rem);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.5;
      margin-bottom: 16px;
    }

    .progress-dots {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 100;
      padding: 8px 16px;
      background: rgba(244,239,230,0.85);
      backdrop-filter: blur(8px);
      border-radius: 20px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(26,26,26,0.15);
      transition: background 0.3s ease, transform 0.3s var(--ease-bounce);
    }
    .dot.active { background: var(--glow); transform: scale(1.2); }
    .dot.correct { background: var(--correct); }
    .dot.wrong { background: var(--wrong); }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: clamp(0.85rem, 2.2vw, 1rem);
      padding: 14px 24px;
      border-radius: var(--radius);
      background: var(--ink);
      color: var(--bg);
      z-index: 200;
      white-space: nowrap;
      transition: transform 0.4s var(--ease-bounce), opacity 0.3s ease;
      opacity: 0;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    #toast.toast-correct { background: var(--correct); }
    #toast.toast-wrong { background: var(--wrong); }

    .photo-frame {
      width: clamp(160px, 40vw, 240px);
      height: clamp(160px, 40vw, 240px);
      border-radius: 50%;
      border: 4px solid var(--glow);
      overflow: hidden;
      margin: 0 auto;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.8s var(--ease-sincere), transform 0.8s var(--ease-sincere);
    }
    .photo-frame.reveal { opacity: 1; transform: scale(1); }
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .timer-bar-wrap {
      width: 100%;
      max-width: 480px;
      height: 8px;
      background: rgba(26,26,26,0.1);
      border-radius: 4px;
      margin: 16px auto;
      overflow: hidden;
    }
    .timer-bar {
      height: 100%;
      background: var(--glow);
      border-radius: 4px;
      transition: width 1s linear;
    }
    .timer-bar.urgent { background: var(--wrong); animation: timerPulse 0.5s ease infinite; }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 360px;
      margin: 20px auto;
    }
    .game-cell {
      aspect-ratio: 1;
      border-radius: var(--radius);
      border: 2px solid rgba(26,26,26,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      cursor: pointer;
      transition: transform 0.15s var(--ease-bounce), border-color 0.2s ease, background 0.2s ease;
      touch-action: manipulation;
      background: rgba(255,255,255,0.5);
      user-select: none;
    }
    .game-cell:active { transform: scale(0.92); }
    .game-cell.found {
      border-color: var(--correct);
      background: rgba(58,125,99,0.1);
      pointer-events: none;
    }
    .game-cell.reveal-item {
      border-color: var(--glow);
      background: rgba(232,184,75,0.1);
      animation: pop 0.4s var(--ease-bounce);
    }

    .finale-screen {
      gap: 8px;
    }
    .finale-screen .sincere-msg {
      max-height: 0;
      overflow: hidden;
      transition: max-height 1.2s var(--ease-sincere), opacity 0.8s ease;
      opacity: 0;
    }
    .finale-screen .sincere-msg.show {
      max-height: 300px;
      opacity: 1;
    }
    .finale-screen .sig {
      opacity: 0;
      transition: opacity 1s ease;
    }
    .finale-screen .sig.show { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 480px) {
      .choice-btn { padding: 16px 20px; }
      .choices-wrap { gap: 10px; margin-top: 20px; }
      .progress-dots { gap: 6px; padding: 6px 12px; }
      .dot { width: 8px; height: 8px; }
      .game-grid { gap: 8px; }
    }
  </style>
</head>
<body>

  <!-- Progress Dots -->
  <div class="progress-dots" id="progressDots"></div>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- INTRO SCREEN -->
  <div class="screen active" id="screen-intro">
    <div class="round-badge">a gift from yug &amp; arham</div>
    <h1 class="title-big">The Shelly Test</h1>
    <p class="subtitle">Seven questions. One rule.<br>You can never pretend to be chill.</p>
    <button class="btn-primary" onclick="Game.start()" style="margin-top: 32px;">Begin</button>
  </div>

  <!-- ROUND SCREENS (dynamically filled) -->
  <div id="round-container"></div>

  <!-- MINI-GAME SCREEN -->
  <div class="screen" id="screen-minigame">
    <div class="round-badge">round 8 &mdash; escape room</div>
    <h2 class="title-med">Escape the Interrogation Room</h2>
    <p class="subtitle">Find all 5 hidden clues before time runs out.</p>
    <div class="timer-bar-wrap"><div class="timer-bar" id="minigameTimerBar"></div></div>
    <p class="body-text" id="minigameStatus" style="margin: 12px 0;">Clues found: 0 / 5</p>
    <div class="game-grid" id="gameGrid"></div>
  </div>

  <!-- FINALE SCREEN -->
  <div class="screen finale-screen" id="screen-finale">
    <div class="round-badge" id="finaleBadge"></div>
    <h2 class="title-med" id="finaleJoke"></h2>
    <p class="body-text" id="finaleJokeSub"></p>
    <div class="sincere-msg" id="finaleSincereWrap">
      <p class="body-text" id="finaleSincere" style="margin-top: 16px;"></p>
    </div>
    <div class="photo-frame" id="finalePhoto">
      <img src="shelly-photo.jpeg" alt="Shelly">
    </div>
    <p class="sig" id="finaleSig" style="margin-top: 24px; font-size: clamp(0.85rem, 2vw, 1rem); opacity: 0.6;">
      happy birthday, shelly.<br>never change.
    </p>
  </div>

  <!-- ROAST POPUP -->
  <div class="roast-popup" id="roastPopup">
    <img src="" alt="Shelly roast">
    <div class="caption"></div>
  </div>

  <script>
    const ROUNDS = [
      {
        id: 1,
        title: 'Round 1 — The House',
        q: 'Arham "accidentally" knocks over Shelly's drink — what does Shelly actually do?',
        correct: 'Immediately escalates it into a whole thing',
        wrong: 'Whatever, no big deal',
        roastImage: 'images/roast1.jpg',
        roastCaption: 'MAKE UP A STORY ABOUT IT, MAJOR DRAMA, YOU BEHAVE WILDLY ABOUT THE OVER-SPOUK, SPLASH!!',
      },
      {
        id: 2,
        title: 'Round 2 — Out and About',
        q: 'Someone cuts Shelly off in line or in traffic — what does Shelly actually do?',
        correct: 'Says something petty about it',
        wrong: 'Lets it go',
        roastImage: 'images/roast2.jpg',
        roastCaption: 'HAVE SPITE WORDS ABOUT THE CUT, PETTY ISNT NICE AT ALL',
      },
      {
        id: 3,
        title: 'Round 3 — Birthday Party',
        q: 'Cake shows up with the wrong flavor — what does Shelly actually do?',
        correct: 'Gets sassy about it',
        wrong: 'Doesn't care, eats it anyway',
        roastImage: 'images/roast3.jpg',
        roastCaption: 'YES YOUrr HAVE TO CONFESS, YOUR EATING HABBITS BAD!',
      },
      {
        id: 4,
        title: 'Round 4 — The Car',
        q: 'Arham\'s in the passenger seat and Shelly\'s behind the wheel — what does Shelly actually do?',
        correct: 'Aggressive tailgater who might crash the car',
        wrong: 'Cautious and calm',
        roastImage: 'images/roast4.jpg',
        roastCaption: 'YOU PULL SOOOONNNG, DO YOU EVEN DRIVE???',
      },
      {
        id: 5,
        title: 'Round 5 — Family Dinner',
        q: 'At the table, what does Shelly actually do?',
        correct: 'Sends food back / makes a scene about it',
        wrong: 'Orders normally, no drama',
        roastImage: 'images/roast5.jpg',
        roastCaption: 'YES YOUR HAVE TO CONFESS, YOUR EATING HABBITS BAD!',
      },
      {
        id: 6,
        title: 'Round 6 — The Interrogation Room',
        q: 'Arham locks Shelly out of her room — what does Shelly actually do?',
        correct: 'Full meltdown, threatens to tell everyone',
        wrong: 'Calmly sits outside for 48 hours, no complaints',
        roastImage: 'images/roast6.jpg',
        roastCaption: 'YOUR BREAKING, BUT YOUR SILENCES FEEL INEXACT!',
      },
      {
        id: 7,
        title: 'Round 7 — Road Trip',
        q: 'The aux cord is finally free — what does Shelly actually do?',
        correct: 'Hijacks it and refuses to give it back for the entire trip',
        wrong: 'Lets everyone pick a song, no fuss',
        roastImage: 'images/roast7.jpg',
        roastCaption: 'YOU TAP THAT AUX CORD, AND YOU OWN ALL THE SONGS!',
      },
    ];

    const ROUND_ORDER = [1, 2, 3, 4, 5, 6, 7];

    const Game = {
      score: 0,
      currentRoundIndex: 0,
      answered: [],

      init() {
        this.buildProgressDots();
        this.buildRoundScreens();
        this.renderDots();
      },

      buildProgressDots() {
        const container = document.getElementById('progressDots');
        const total = 7;
        container.innerHTML = '';
        for (let i = 0; i < total; i++) {
          const dot = document.createElement('div');
          dot.className = 'dot';
          dot.dataset.index = i;
          container.appendChild(dot);
        }
      },

      renderDots() {
        const dots = document.querySelectorAll('.dot');
        dots.forEach((dot, i) => {
          dot.classList.remove('active', 'correct', 'wrong');
          if (i === this.currentRoundIndex) {
            dot.classList.add('active');
          } else if (i < this.answered.length) {
            dot.classList.add(this.answered[i] ? 'correct' : 'wrong');
          }
        });
      },

      show(id) {
        document.querySelectorAll('.screen').forEach(s => {
          s.classList.remove('active');
          s.style.display = 'none';
        });
        const screen = document.getElementById(id);
        screen.style.display = 'flex';
        // Force reflow for animation restart
        void screen.offsetWidth;
        screen.classList.add('active');
      },

      start() {
        this.score = 0;
        this.currentRoundIndex = 0;
        this.answered = [];
        this.show('progressDots');
        this.loadRound();
      },

      loadRound() {
        if (this.currentRoundIndex < ROUND_ORDER.length) {
          const roundId = ROUND_ORDER[this.currentRoundIndex];
          const round = ROUNDS.find(r => r.id === roundId);
          this.showRound(round);
        } else {
          this.showFinale();
        }
        this.renderDots();
      },

      showRound(round) {
        const screen = document.getElementById('screen-round');
        screen.querySelector('.round-badge').textContent = round.title;
        screen.querySelector('h2').textContent = round.q;
        const choices = screen.querySelectorAll('.choice-btn');
        choices[0].innerHTML = `${round.correct}<span class="label correct-label">CORRECT</span>`;
        choices[1].innerHTML = `${round.wrong}<span class="label wrong-label">WRONG</span>`;
        choices.forEach(b => b.className = 'choice-btn');
        screen.dataset.roundId = round.id;
        screen.dataset.roastImage = round.roastImage || '';
        screen.dataset.roastCaption = round.roastCaption || '';
        this.show('screen-round');
      },

      handleChoice(choice) {
        const screen = document.getElementById('screen-round');
        const roundId = parseInt(screen.dataset.roundId);
        const round = ROUNDS.find(r => r.id === roundId);
        const buttons = screen.querySelectorAll('.choice-btn');

        const isCorrect = choice === 'correct';
        if (isCorrect) this.score++;

        // Visual feedback
        const chosenBtn = buttons[choice === 'correct' ? 0 : 1];
        chosenBtn.classList.add(isCorrect ? 'correct' : 'wrong');
        buttons.forEach(b => {
          if (b !== chosenBtn) b.classList.add('disabled');
        });

        // Feedback
        if (isCorrect) {
          this.toast('Well played. The calm is strong.', 'toast-correct');
        } else {
          // Screen shake
          document.getElementById('screen-round').classList.add('shake');
          setTimeout(() => {
            document.getElementById('screen-round').classList.remove('shake');
          }, 500);
          // Roast popup
          setTimeout(() => {
            this.showRoast(round);
          }, 300);
        }

        this.answered.push(isCorrect);

        // Advance after delay
        setTimeout(() => {
          this.currentRoundIndex++;
          this.loadRound();
        }, 1600);
      },

      showRoast(round) {
        const popup = document.getElementById('roastPopup');
        const img = popup.querySelector('img');
        const caption = popup.querySelector('.caption');
        img.src = round.roastImage;
        img.alt = 'Shelly roast';
        caption.textContent = 'Is that really what you would\'ve done???';
        popup.classList.add('show');
        setTimeout(() => {
          popup.classList.remove('show');
        }, 2000);
      },

      showFinale() {
        const correctCount = this.answered.filter(Boolean).length;
        const total = this.answered.length;
        const pct = Math.round((correctCount / total) * 100);

        // Phase 1: joke beat
        const badge = document.getElementById('finaleBadge');
        const joke = document.getElementById('finaleJoke');
        const jokeSub = document.getElementById('finaleJokeSub');
        const sincereWrap = document.getElementById('finaleSincereWrap');
        const sincere = document.getElementById('finaleSincere');
        const photo = document.getElementById('finalePhoto');
        const sig = document.getElementById('finaleSig');

        // Reset
        sincereWrap.classList.remove('show');
        photo.classList.remove('reveal');
        sig.classList.remove('show');

        badge.textContent = 'the verdict';
        joke.textContent = `You scored ${correctCount} / ${total}. That's ${pct}% calm.`;
        jokeSub.textContent = 'Shelly could never.';

        this.show('screen-finale');

        // Phase 2: sincere reveal
        setTimeout(() => {
          sincere.textContent = `But this was never really about being calm. It's about the fact that your chaos is exactly what makes you, you. And that's worth celebrating.`;
          sincereWrap.classList.add('show');
        }, 3500);

        // Phase 3: photo
        setTimeout(() => {
          photo.classList.add('reveal');
        }, 4200);

        // Phase 4: signature
        setTimeout(() => {
          sig.classList.add('show');
        }, 5000);
      },

      toast(msg, cls) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = cls || '';
        t.classList.add('show');
        clearTimeout(this._toastTimer);
        this._toastTimer = setTimeout(() => {
          t.classList.remove('show');
        }, 2400);
      },
    };

    // Build the round screen container
    (function buildRoundScreen() {
      const container = document.getElementById('round-container');
      container.innerHTML = `
        <div class="screen" id="screen-round">
          <div class="round-badge"></div>
          <h2 class="title-med"></h2>
          <div class="choices-wrap">
            <button class="choice-btn" onclick="Game.handleChoice('correct')"></button>
            <button class="choice-btn" onclick="Game.handleChoice('wrong')"></button>
          </div>
        </div>
      `;
    })();

    Game.init();
  </script>
</body>
</html>
