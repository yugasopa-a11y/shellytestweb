<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F4EFE6">
  <title>The Shelly Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F4EFE6;
      --ink: #1A1A1A;
      --correct: #3A7D63;
      --wrong: #C1443D;
      --glow: #E8B84B;
      --radius: 16px;
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-sincere: cubic-bezier(0.25, 0.1, 0.25, 1);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html {
      height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      overscroll-behavior: none;
    }

    /* ─── SCREEN SYSTEM ─── */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(20px + var(--safe-top)) calc(20px + var(--safe-bottom));
      text-align: center;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .screen.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 10;
      animation: screenIn 0.5s var(--ease-bounce) both;
    }
    .screen.exit {
      animation: screenOut 0.3s ease both;
    }

    @keyframes screenIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes screenOut {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(0.96); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      15% { transform: translateX(-8px) rotate(-0.5deg); }
      30% { transform: translateX(8px) rotate(0.5deg); }
      45% { transform: translateX(-6px); }
      60% { transform: translateX(6px); }
      75% { transform: translateX(-3px); }
      90% { transform: translateX(3px); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    @keyframes goldGlow {
      0%, 100% { box-shadow: 0 0 0 4px rgba(232,184,75,0.3); }
      50% { box-shadow: 0 0 0 8px rgba(232,184,75,0.15), 0 0 30px rgba(232,184,75,0.25); }
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    @keyframes timerPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-2deg); }
      75% { transform: rotate(2deg); }
    }

    /* ─── TYPOGRAPHY ─── */
    h1, h2, h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      line-height: 1.1;
    }

    .title-huge {
      font-size: clamp(2.8rem, 10vw, 5.5rem);
      letter-spacing: -0.04em;
    }
    .title-big {
      font-size: clamp(1.8rem, 6vw, 3.2rem);
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .title-med {
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      color: rgba(26,26,26,0.55);
      margin-top: 12px;
      line-height: 1.55;
      max-width: 380px;
    }

    .body-text {
      font-size: clamp(0.9rem, 2.2vw, 1rem);
      line-height: 1.65;
      max-width: 400px;
      color: rgba(26,26,26,0.7);
    }

    /* ─── PROGRESS DOTS ─── */
    .progress {
      position: fixed;
      top: calc(12px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 100;
      padding: 8px 16px;
      background: rgba(244,239,230,0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .progress.visible { opacity: 1; }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(26,26,26,0.12);
      transition: all 0.4s var(--ease-bounce);
    }
    .dot.active { background: var(--glow); transform: scale(1.3); }
    .dot.correct { background: var(--correct); }
    .dot.wrong { background: var(--wrong); }

    /* ─── BUTTONS ─── */
    .btn {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      transition: transform 0.2s var(--ease-bounce), box-shadow 0.2s ease, background 0.2s ease;
    }
    .btn:active { transform: scale(0.96) !important; }

    .btn-start {
      font-size: clamp(1.1rem, 3vw, 1.3rem);
      padding: 18px 56px;
      background: var(--ink);
      color: var(--bg);
      min-height: 58px;
      margin-top: 36px;
    }
    .btn-start:hover { transform: scale(1.04); box-shadow: 0 6px 24px rgba(0,0,0,0.18); }

    .btn-choice {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: clamp(0.95rem, 2.5vw, 1.05rem);
      width: 100%;
      max-width: 480px;
      padding: 20px 24px;
      border: 2px solid rgba(26,26,26,0.12);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.6);
      color: var(--ink);
      text-align: left;
      line-height: 1.5;
      min-height: 64px;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .btn-choice:hover {
      border-color: rgba(26,26,26,0.25);
      background: rgba(255,255,255,0.85);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    .btn-choice.correct {
      border-color: var(--correct);
      background: rgba(58,125,99,0.1);
      animation: pulse 0.5s var(--ease-bounce);
    }
    .btn-choice.wrong {
      border-color: var(--wrong);
      background: rgba(193,68,61,0.1);
      animation: pulse 0.5s var(--ease-bounce);
    }
    .btn-choice.locked { pointer-events: none; }

    .choice-label {
      display: block;
      margin-top: 8px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0;
      transform: translateY(4px);
      transition: all 0.3s var(--ease-bounce);
    }
    .choice-label.show {
      opacity: 1;
      transform: translateY(0);
    }
    .choice-label.correct-lbl { color: var(--correct); }
    .choice-label.wrong-lbl { color: var(--wrong); }

    .choices-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 480px;
      margin-top: 28px;
    }

    /* ─── ROUND LABEL ─── */
    .round-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(26,26,26,0.4);
      margin-bottom: 20px;
    }
    .round-label .emoji {
      font-size: 1rem;
      animation: wiggle 2s ease infinite;
    }

    /* ─── QUESTION ─── */
    .question {
      max-width: 500px;
      line-height: 1.25;
    }

    /* ─── TOAST ─── */
    #toast {
      position: fixed;
      bottom: calc(24px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(140px);
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: clamp(0.85rem, 2.2vw, 0.95rem);
      padding: 14px 22px;
      border-radius: 12px;
      background: var(--ink);
      color: var(--bg);
      z-index: 300;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: transform 0.4s var(--ease-bounce), opacity 0.3s ease;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    #toast.toast-correct { background: var(--correct); }
    #toast.toast-wrong { background: var(--wrong); }

    /* ─── MINI GAME ─── */
    .timer-wrap {
      width: 100%;
      max-width: 400px;
      height: 6px;
      background: rgba(26,26,26,0.08);
      border-radius: 3px;
      margin: 20px auto 0;
      overflow: hidden;
    }
    .timer-fill {
      height: 100%;
      background: var(--glow);
      border-radius: 3px;
      transition: width 1s linear;
      width: 100%;
    }
    .timer-fill.urgent {
      background: var(--wrong);
      animation: timerPulse 0.6s ease infinite;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 320px;
      margin: 24px auto;
    }

    .cell {
      aspect-ratio: 1;
      border-radius: 14px;
      border: 2px solid rgba(26,26,26,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.4rem, 5vw, 2rem);
      cursor: pointer;
      transition: transform 0.15s var(--ease-bounce), border-color 0.2s ease, background 0.2s ease;
      touch-action: manipulation;
      background: rgba(255,255,255,0.5);
      -webkit-user-select: none;
      user-select: none;
    }
    .cell:active { transform: scale(0.9); }
    .cell.found {
      border-color: var(--correct);
      background: rgba(58,125,99,0.08);
      pointer-events: none;
      animation: pop 0.4s var(--ease-bounce);
    }
    .cell.peek {
      border-color: var(--glow);
      background: rgba(232,184,75,0.1);
    }

    .game-status {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      color: rgba(26,26,26,0.5);
      margin-top: 4px;
    }

    /* ─── FINALE ─── */
    .finale .sincere {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 1.2s var(--ease-sincere), opacity 0.8s ease 0.2s;
    }
    .finale .sincere.show { max-height: 200px; opacity: 1; }

    .photo-ring {
      width: clamp(150px, 40vw, 220px);
      height: clamp(150px, 40vw, 220px);
      border-radius: 50%;
      border: 3px solid var(--glow);
      padding: 6px;
      margin: 0 auto;
      opacity: 0;
      transform: scale(0.85);
      transition: all 1s var(--ease-sincere);
    }
    .photo-ring.show {
      opacity: 1;
      transform: scale(1);
      animation: goldGlow 3s ease infinite;
    }
    .photo-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .signature {
      opacity: 0;
      transition: opacity 1.2s ease;
      color: rgba(26,26,26,0.4);
      font-size: clamp(0.8rem, 2vw, 0.95rem);
      line-height: 1.6;
    }
    .signature.show { opacity: 1; }

    /* ─── INTRO SPECIFICS ─── */
    .intro-tag {
      font-size: clamp(0.7rem, 1.8vw, 0.8rem);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: rgba(26,26,26,0.35);
      font-weight: 500;
      margin-bottom: 16px;
    }

    .intro-divider {
      width: 40px;
      height: 3px;
      background: var(--glow);
      border-radius: 2px;
      margin: 20px auto 0;
    }

    /* ─── MOBILE TWEAKS ─── */
    @media (max-width: 400px) {
      .btn-choice { padding: 16px 18px; font-size: 0.9rem; }
      .choices-wrap { gap: 10px; margin-top: 22px; }
      .progress { gap: 5px; padding: 6px 12px; }
      .game-grid { gap: 8px; max-width: 280px; }
    }

    @media (min-width: 768px) {
      .screen { padding: 48px; }
      .btn-choice { font-size: 1.05rem; padding: 22px 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.15s !important;
      }
    }
  </style>
</head>
<body>

  <!-- Progress -->
  <div class="progress" id="progress"></div>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- ═══════ INTRO ═══════ -->
  <div class="screen active" id="intro">
    <p class="intro-tag">a gift from yug &amp; arham</p>
    <h1 class="title-huge">The Shelly<br>Test</h1>
    <p class="subtitle">Seven questions. One rule.<br>You can never pretend to be chill.</p>
    <div class="intro-divider"></div>
    <button class="btn btn-start" onclick="Q.start()">Begin the test</button>
  </div>

  <!-- ═══════ QUIZ ROUND ═══════ -->
  <div class="screen" id="round">
    <div class="round-label" id="roundLabel"><span class="emoji"></span><span class="text"></span></div>
    <h2 class="title-big question" id="roundQ"></h2>
    <div class="choices-wrap" id="roundChoices">
      <button class="btn btn-choice" onclick="Q.answer(0)">
        <span class="text"></span>
        <span class="choice-label"></span>
      </button>
      <button class="btn btn-choice" onclick="Q.answer(1)">
        <span class="text"></span>
        <span class="choice-label"></span>
      </button>
    </div>
  </div>

  <!-- ═══════ MINI GAME ═══════ -->
  <div class="screen" id="minigame">
    <div class="round-label"><span class="emoji">🔦</span><span class="text">escape room</span></div>
    <h2 class="title-big">Escape the Interrogation Room</h2>
    <p class="subtitle">Find all 5 hidden clues. You have 30 seconds.</p>
    <div class="timer-wrap"><div class="timer-fill" id="timerFill"></div></div>
    <p class="game-status" id="gameStatus">Clues found: 0 / 5</p>
    <div class="game-grid" id="gameGrid"></div>
  </div>

  <!-- ═══════ FINALE ═══════ -->
  <div class="screen finale" id="finale">
    <div class="round-label"><span class="emoji">🎂</span><span class="text" id="finaleTag"></span></div>
    <h2 class="title-big" id="finaleJoke"></h2>
    <p class="body-text" id="finaleJokeSub" style="margin-top: 12px;"></p>
    <div class="sincere" id="sincereWrap">
      <p class="body-text" id="sincereMsg" style="margin-top: 20px;"></p>
    </div>
    <div class="photo-ring" id="photoRing">
      <img src="shelly-photo.jpeg" alt="Shelly">
    </div>
    <p class="signature" id="sigLine">
      happy birthday, shelly.<br>never change.
    </p>
  </div>

<script>
const EMOJIS = { coffee: '☕', uber: '🚗', plans: '🌙', car: '💨', phone: '📱', wifi: '📡', restaurant: '🍽️' };

const ROUNDS = [
  {
    id: 1, theme: 'coffee',
    q: 'You spill coffee on your laptop. What\'s your first move?',
    a: [
      { text: 'Stay calm. Save the files. Rice can wait.', type: 'correct' },
      { text: 'Scream, blame the mug, and take 14 photos for Instagram.', type: 'wrong' },
    ],
    toastWrong: 'THE MUG GETS BLAMED 😤',
  },
  {
    id: 2, theme: 'uber',
    q: 'Your Uber is 3 minutes away. What do you do?',
    a: [
      { text: 'Put on shoes. Walk to the door. Simple.', type: 'correct' },
      { text: 'Panic. Check the map 11 times. Text "omw" from the couch.', type: 'wrong' },
    ],
    toastWrong: 'YOU TEXTED "I\'M HERE" STILL IN PAJAMAS 😭',
  },
  {
    id: 3, theme: 'plans',
    q: 'Friday night plans fall through. You...',
    a: [
      { text: 'Stay in. Read a book. Early night.', type: 'correct' },
      { text: 'Overanalyze. Text everyone. Binge-watch at 2 AM.', type: 'wrong' },
    ],
    toastWrong: 'THE OVERANALYZING IS SO REAL 🫠',
  },
  {
    id: 4, theme: 'car',
    q: 'Someone is tailgating you aggressively.',
    a: [
      { text: 'Move over when safe. Let them pass. Breathe.', type: 'correct' },
      { text: 'Brake-check them, make eye contact in the mirror, mutter threats.', type: 'wrong' },
    ],
    toastWrong: 'THE BRAKE CHECK IS INSTINCTIVE 🚗',
    shake: true,
  },
  {
    id: 5, theme: 'phone',
    q: 'Your phone dies at 7%. What do you do?',
    a: [
      { text: 'Find a charger or turn on low power mode.', type: 'correct' },
      { text: 'Mental breakdown. Frantically text "MY PHONE MIGHT DIE."', type: 'wrong' },
    ],
    toastWrong: 'THE PREEMPTIVE GOODBYE TEXT 💀',
  },
  {
    id: 6, theme: 'wifi',
    q: 'WiFi goes down for 10 minutes. Your reaction?',
    a: [
      { text: 'Wait. Maybe read a book. No big deal.', type: 'correct' },
      { text: 'Check router, restart phone, reboot laptop, question all life choices.', type: 'wrong' },
    ],
    toastWrong: 'THE FULL IT DEPARTMENT ACTIVATED 🔧',
  },
  {
    id: 7, theme: 'restaurant',
    q: 'Your food order comes wrong. What do you do?',
    a: [
      { text: 'Politely tell the server. Get it fixed. Move on.', type: 'correct' },
      { text: 'Say it\'s fine. Eat it. Compose 3 texts about it later.', type: 'wrong' },
    ],
    toastWrong: 'THE PASSIVE-AGGRESSIVE "IT\'S FINE" 😬',
  },
];

const ROUND_ORDER = [4, 1, 2, 3, 5, 6, 7];

const CLUE_EMOJIS = ['🔍', '🗝️', '📜', '💡', '🔐'];
const FILLER_EMOJIS = ['📎', '☕', '🗂️', '🧷', '📌', '✏️', '🗑️', '📏', '🧲'];

const Q = {
  score: 0,
  roundIdx: 0,
  results: [],
  shakePlayed: false,
  gameDone: false,

  /* ─── NAVIGATION ─── */
  show(id) {
    const target = document.getElementById(id);
    const current = document.querySelector('.screen.active');
    if (current && current !== target) {
      current.classList.remove('active');
      current.classList.add('exit');
      current.addEventListener('animationend', () => {
        current.classList.remove('exit');
      }, { once: true });
    }
    target.classList.add('active');
  },

  showProgress(on) {
    document.getElementById('progress').classList.toggle('visible', on);
  },

  /* ─── INIT ─── */
  init() {
    this.buildDots();
    this.show('intro');
  },

  /* ─── START ─── */
  start() {
    this.score = 0;
    this.roundIdx = 0;
    this.results = [];
    this.shakePlayed = false;
    this.gameDone = false;
    this.buildDots();
    this.showProgress(true);
    this.renderDots();
    this.loadRound();
  },

  /* ─── DOTS ─── */
  buildDots() {
    const el = document.getElementById('progress');
    el.innerHTML = '';
    for (let i = 0; i < 8; i++) {
      const d = document.createElement('div');
      d.className = 'dot';
      el.appendChild(d);
    }
  },

  renderDots() {
    const dots = document.querySelectorAll('.dot');
    dots.forEach((d, i) => {
      d.classList.remove('active', 'correct', 'wrong');
      if (i === this.roundIdx) d.classList.add('active');
      else if (i < this.results.length) d.classList.add(this.results[i] ? 'correct' : 'wrong');
    });
  },

  /* ─── LOAD ROUND ─── */
  loadRound() {
    this.renderDots();
    if (this.roundIdx < ROUND_ORDER.length) {
      const id = ROUND_ORDER[this.roundIdx];
      const r = ROUNDS.find(r => r.id === id);
      this.renderRound(r);
      this.show('round');
    } else if (!this.gameDone) {
      this.startGame();
    } else {
      this.renderFinale();
      this.show('finale');
    }
  },

  /* ─── RENDER ROUND ─── */
  renderRound(r) {
    const label = document.getElementById('roundLabel');
    label.querySelector('.emoji').textContent = EMOJIS[r.theme] || '❓';
    label.querySelector('.text').textContent = `round ${r.id}`;

    document.getElementById('roundQ').textContent = r.q;

    const btns = document.querySelectorAll('#roundChoices .btn-choice');
    r.a.forEach((a, i) => {
      const btn = btns[i];
      btn.querySelector('.text').textContent = a.text;
      btn.className = 'btn btn-choice';
      const lbl = btn.querySelector('.choice-label');
      lbl.className = 'choice-label';
      lbl.textContent = a.type === 'correct' ? '✓ Reasonable' : '✗ The real Shelly';
      lbl.classList.add(a.type === 'correct' ? 'correct-lbl' : 'wrong-lbl');
    });

    document.getElementById('round').dataset.shake = r.shake ? '1' : '0';
    document.getElementById('round').dataset.toastWrong = r.toastWrong;
  },

  /* ─── ANSWER ─── */
  answer(idx) {
    const r = ROUNDS.find(r => r.id === ROUND_ORDER[this.roundIdx]);
    const btns = document.querySelectorAll('#roundChoices .btn-choice');
    const chosen = btns[idx];
    const other = btns[1 - idx];
    const isCorrect = r.a[idx].type === 'correct';

    if (isCorrect) this.score++;
    this.results.push(isCorrect);

    // Lock + highlight
    btns.forEach(b => b.classList.add('locked'));
    chosen.classList.add(isCorrect ? 'correct' : 'wrong');
    chosen.querySelector('.choice-label').classList.add('show');

    // Toast
    if (isCorrect) {
      this.toast('Well played. The calm is strong.', 'toast-correct');
    } else {
      this.toast(r.toastWrong, 'toast-wrong');
      // Shake for round 4
      if (r.shake && !this.shakePlayed) {
        this.shakePlayed = true;
        setTimeout(() => {
          document.getElementById('round').style.animation = 'shake 0.5s ease';
          document.getElementById('round').addEventListener('animationend', () => {
            document.getElementById('round').style.animation = '';
          }, { once: true });
        }, 200);
      }
    }

    // Advance
    setTimeout(() => {
      this.roundIdx++;
      this.loadRound();
    }, 1500);
  },

  /* ─── MINI GAME ─── */
  startGame() {
    this.show('minigame');
    this.gameFound = 0;
    this.gameTotal = CLUE_EMOJIS.length;
    this.gameActive = true;
    document.getElementById('gameStatus').textContent = `Clues found: 0 / ${this.gameTotal}`;
    this.buildGrid();
    this.startTimer();
  },

  buildGrid() {
    const grid = document.getElementById('gameGrid');
    grid.innerHTML = '';
    const positions = new Set();
    while (positions.size < this.gameTotal) {
      positions.add(Math.floor(Math.random() * 9));
    }
    const clueArr = [...CLUE_EMOJIS];
    let clueIdx = 0;

    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (positions.has(i)) {
        cell.dataset.clue = clueArr[clueIdx++];
        cell.dataset.isClue = '1';
      } else {
        cell.textContent = FILLER_EMOJIS[i % FILLER_EMOJIS.length];
      }
      cell.addEventListener('click', () => this.tapCell(cell));
      grid.appendChild(cell);
    }
  },

  tapCell(cell) {
    if (!this.gameActive || cell.classList.contains('found')) return;

    if (cell.dataset.isClue) {
      cell.classList.add('found');
      cell.textContent = cell.dataset.clue;
      this.gameFound++;
      document.getElementById('gameStatus').textContent = `Clues found: ${this.gameFound} / ${this.gameTotal}`;
      if (this.gameFound >= this.gameTotal) {
        this.gameActive = false;
        this.toast('Room escaped. That was close.', 'toast-correct');
        setTimeout(() => {
          this.gameDone = true;
          this.roundIdx++;
          this.loadRound();
        }, 1000);
      }
    } else {
      cell.classList.add('peek');
      this.toast('Not here. Keep looking.', '');
      setTimeout(() => cell.classList.remove('peek'), 500);
    }
  },

  startTimer() {
    const bar = document.getElementById('timerFill');
    bar.style.width = '100%';
    bar.classList.remove('urgent');
    const duration = 30000;
    const start = Date.now();

    const tick = () => {
      if (!this.gameActive) return;
      const pct = Math.max(0, 100 - ((Date.now() - start) / duration * 100));
      bar.style.width = pct + '%';
      if (pct < 25) bar.classList.add('urgent');
      if (pct <= 0) {
        this.gameActive = false;
        this.toast('Time\'s up. The room keeps you.', 'toast-wrong');
        setTimeout(() => {
          this.gameDone = true;
          this.roundIdx++;
          this.loadRound();
        }, 1000);
        return;
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  },

  /* ─── FINALE ─── */
  renderFinale() {
    const correct = this.results.filter(Boolean).length;
    const total = this.results.length;
    const pct = Math.round((correct / total) * 100);

    // Reset
    const sincereWrap = document.getElementById('sincereWrap');
    const photo = document.getElementById('photoRing');
    const sig = document.getElementById('sigLine');
    sincereWrap.classList.remove('show');
    photo.classList.remove('show');
    sig.classList.remove('show');

    document.getElementById('finaleTag').textContent = 'the verdict';
    document.getElementById('finaleJoke').textContent = `You scored ${correct} / ${total}. That's ${pct}% calm.`;
    document.getElementById('finaleJokeSub').textContent = 'Shelly could never.';

    // Phase 1: joke (immediate)
    this.show('finale');

    // Phase 2: sincere (3s)
    setTimeout(() => {
      document.getElementById('sincereMsg').textContent =
        'But this was never really about being calm. It\'s about the fact that your chaos is exactly what makes you, you. And that\'s worth celebrating.';
      sincereWrap.classList.add('show');
    }, 3000);

    // Phase 3: photo (4s)
    setTimeout(() => photo.classList.add('show'), 4000);

    // Phase 4: signature (5s)
    setTimeout(() => sig.classList.add('show'), 5000);
  },

  /* ─── TOAST ─── */
  toast(msg, cls) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = cls || '';
    requestAnimationFrame(() => t.classList.add('show'));
    clearTimeout(this._tt);
    this._tt = setTimeout(() => t.classList.remove('show'), 2400);
  },
};

Q.init();
</script>
